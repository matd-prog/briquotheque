# Essai ponctuel (à la main) : téléchargement du catalogue BrickLink sans compte (outils/sonde_bricklink.py).
name: Essai catalogue BrickLink
on:
  workflow_dispatch:
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u outils/sonde_bricklink.py
