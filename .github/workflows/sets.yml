# Catalogue des sets LEGO et nouveautés (Rebrickable) -> data/sets.tsv, data/sets_figurines.tsv
# (outils/sets_rebrickable.py), data/nouveautes.tsv (outils/nouveautes_rebrickable.py) et
# data/nouveautes_empreintes.tsv (outils/empreintes_nouveautes.js).
# Tourne sur les serveurs de GitHub (Rebrickable n'est pas joignable depuis l'environnement cloud de Claude).
# Chaque jour à 4h50 (UTC), pour qu'une sortie soit connue dès son arrivée en magasin, ou à la main :
# onglet « Actions » -> « Catalogue des sets et nouveautés » -> « Run workflow ».
name: Catalogue des sets et nouveautés

on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement des fichiers de Rebrickable
        run: |
          mkdir -p /tmp/rb
          for f in sets themes inventories inventory_minifigs minifigs; do
            curl -sfL --retry 3 -A "Mozilla/5.0 (catalogue personnel de collectionneur LEGO)" \
              -o /tmp/rb/$f.csv.gz https://cdn.rebrickable.com/media/downloads/$f.csv.gz
          done
      - name: Catalogue des sets
        run: python3 -u outils/sets_rebrickable.py /tmp/rb
      - name: Nouveautés
        run: python3 -u outils/nouveautes_rebrickable.py /tmp/rb
      - name: Empreintes des nouvelles figurines
        run: |
          npm install --no-save playwright@1
          npx playwright install chromium
          node outils/empreintes_nouveautes.js
      - name: Publication
        run: |
          git add data/sets.tsv data/sets_figurines.tsv data/nouveautes.tsv data/nouveautes_empreintes.tsv
          # seule la date a changé : rien à publier
          if ! git diff --cached -U0 | grep -q '^[+-][^+#-]'; then echo "Rien de nouveau"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Catalogue des sets et nouveautés : $(grep -c '^[0-9A-Za-z]' data/sets.tsv) sets, $(grep -cE '^(figurine|set|objet)	' data/nouveautes.tsv) nouveautés ($(date +%F))"
          git pull --rebase origin main   # d'autres changements ont pu être publiés entre-temps
          git push origin HEAD:main
